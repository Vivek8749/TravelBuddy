[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travelbuddy"
version = "0.1.0"
description = "Agentic AI travel planner using local Ollama (or hosted) LLMs with web search and budget planning tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "openai>=1.40",
    "anthropic>=0.40",
    "ddgs>=9.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
travelbuddy = "travelbuddy.cli:main"

[tool.setuptools.packages.find]
include = ["travelbuddy*"]

[tool.setuptools.package-data]
travelbuddy = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
